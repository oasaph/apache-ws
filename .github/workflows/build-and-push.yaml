name: Build and Push Docker Image

on:
  pull_request:
    types:
      - closed

jobs:
  build-and-push:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python for version bump
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Bump version in VERSION file (semantic, based on PR title)
        id: bump_version
        shell: bash
        run: |
          VERSION_FILE=VERSION
          if [ ! -f "$VERSION_FILE" ]; then echo "0.0.0" > $VERSION_FILE; fi
          OLD_VERSION=$(cat $VERSION_FILE)
          IFS='.' read -r major minor patch <<< "$OLD_VERSION"
          PR_TITLE="${{ github.event.pull_request.title }}"
          case "$PR_TITLE" in
            breaking-change*)
              major=$((major+1))
              minor=0
              patch=0
              BUMP_TYPE="major"
              ;;
            feat*)
              minor=$((minor+1))
              patch=0
              BUMP_TYPE="minor"
              ;;
            fix*)
              patch=$((patch+1))
              BUMP_TYPE="patch"
              ;;
            *)
              patch=$((patch+1))
              BUMP_TYPE="patch (default)"
              ;;
          esac
          NEW_VERSION="$major.$minor.$patch"
          echo $NEW_VERSION > $VERSION_FILE
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT

      - name: Commit and push updated VERSION file
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add VERSION
          git commit -m "Bump version to ${{ steps.bump_version.outputs.new_version }}" || echo "No changes to commit"
          git push origin HEAD:${{ github.base_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/apache-ws:${{ github.base_ref }}-${{ steps.bump_version.outputs.new_version }}
